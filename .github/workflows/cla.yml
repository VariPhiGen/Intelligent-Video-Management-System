# CLA check — every pull request must be covered by a signed CLA (see /CLA.md)
# before it can be merged, because contributed code has to be distributable
# under both the AGPL-3.0 and the commercial licence.
#
# Signatures are stored as JSON on a dedicated branch of this repository, so
# there is no external service holding them.
#
# SETUP REQUIRED before this works:
#   1. Repository path — DONE 2026-08-31: VariPhiGen/Intelligent-Video-Management-System.
#   2. Create a repo secret CLA_SIGNATURES_TOKEN — a fine-grained PAT with
#      Contents: read/write on this repository. The default GITHUB_TOKEN cannot
#      push to the signature branch from a pull_request_target run.
#   3. Create the empty branch:  git switch --orphan cla-signatures
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    # `reopened` is here because leaving it out is a hole, found on 2026-09-16
    # by the smoke-test PR. On `closed` this action reports success and locks
    # the conversation — correct, there is nothing left to gate. But without
    # `reopened` nothing re-runs when the PR comes back, so GitHub keeps
    # displaying that success: a green CLA check on an unsigned PR. Any push
    # would fix it via `synchronize`, which is exactly why it is easy to miss —
    # close, reopen, merge, and no signature was ever collected.
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/VariPhiGen/Intelligent-Video-Management-System/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],renovate[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: |
            Thanks for the pull request. Before it can be merged we need a
            signed Contributor License Agreement — it lets the project ship
            your code under both the AGPL and the commercial licence.
            Please read **[CLA.md](https://github.com/VariPhiGen/Intelligent-Video-Management-System/blob/main/CLA.md)**
            and then comment exactly:
