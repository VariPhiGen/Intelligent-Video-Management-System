# Hindi bundle for the Variphi login theme.
#
# Keycloak ships no `hi` translations, so `locales=en,hi` in theme.properties
# only works because this file exists. It covers the strings THIS theme renders;
# anything else (a rare error page, an OTP prompt) falls back to English rather
# than showing a raw message key — a partly-English page beats a broken one.
#
# Keycloak 24+ reads message bundles as UTF-8, so Devanagari is written directly.

locale_en=EN
locale_hi=हिं

loginAccountTitle=सुरक्षित ऑपरेटर साइन-इन
vSignInSub=केवल अधिकृत कर्मियों के लिए। इस प्रणाली पर की गई प्रत्येक कार्रवाई लॉग की जाती है।

username=ऑपरेटर आईडी
usernameOrEmail=ऑपरेटर आईडी
password=पासवर्ड

doLogIn=साइन इन →
rememberMe=इस वर्कस्टेशन को याद रखें

doForgotPassword=पासवर्ड भूल गए?
doTryAnotherWay=किसी अन्य तरीके से प्रयास करें

invalidUserMessage=अमान्य उपयोगकर्ता नाम या पासवर्ड।
accountDisabledMessage=खाता निष्क्रिय है, व्यवस्थापक से संपर्क करें।
accountTemporarilyDisabledMessage=खाता अस्थायी रूप से अवरुद्ध है, बाद में पुनः प्रयास करें।

vLegalLine1=संरक्षित प्रणाली। समस्त पहुँच CERT-In निर्देश 2022 के अंतर्गत लॉग की जाती है।
vLegalLine2=अनधिकृत उपयोग एक दंडनीय अपराध है।
