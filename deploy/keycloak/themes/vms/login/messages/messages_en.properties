# English overrides for the Variphi login theme. Anything not listed here falls
# through to Keycloak's own bundle, so only the strings the design changes live
# in this file.

# The pill labels in the language switcher (base bundle says "English").
locale_en=EN
locale_hi=हिं

# Sign-in card
loginAccountTitle=Secure operator sign-in
vSignInSub=For authorised personnel only. Every action on this system is logged.

# The design labels the identity field "Operator ID" rather than username/email.
username=Operator ID
usernameOrEmail=Operator ID
password=Password

doLogIn=Sign in →

# Keycloak's rememberMe checkbox, rendered as the switch in the design.
# NOTE: deliberately does NOT mention MFA. The prototype's label read
# "Remember this workstation · MFA via authenticator", but this realm has no
# OTP requirement configured — claiming MFA on the sign-in screen would tell
# operators they have a second factor they do not actually have.
rememberMe=Remember this workstation

vLegalLine1=Protected system. All access is logged under CERT-In Directions 2022.
vLegalLine2=Unauthorised use is an offence.
