# Variphi login theme — split-screen sign-in (brand narrative left, form right),
# matching the product design and the dashboard in BOTH light and dark.
#
# parent=keycloak still gives us Keycloak's page templates (login.ftl,
# login-otp.ftl, login-reset-password.ftl, error.ftl …) and its message bundles.
# What we override is template.ftl — the LAYOUT those pages render into.
#
# css/login.css (the parent's PatternFly stylesheet) is deliberately NOT listed:
# template.ftl replaces that layout wholesale, and loading PatternFly on top of
# it only fights our own rules. vms.css therefore styles form controls by
# element/id, so the inherited pages we don't hand-write still look right.
#
# js/theme.js keeps this page's light/dark in sync with the dashboard via the
# shared vms-theme cookie (localStorage can't cross the port boundary to the SPA
# origin; cookies can). It applies the theme in <head> before first paint and
# drives the on-page toggle. Default is light — the dashboard's default — and the
# OS theme is ignored, so the two never disagree on a fresh visit.
parent=keycloak
import=common/keycloak
styles=css/vms.css
scripts=js/theme.js

# Locales offered by the language switcher. Keycloak ships no Hindi bundle, so
# messages/messages_hi.properties supplies the strings this theme renders; any
# string it doesn't define falls back to English rather than showing a key.
locales=en,hi
