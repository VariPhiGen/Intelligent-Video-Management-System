# ─────────────────────────────────────────────────────────────────────────────
# Variphi VMS — unified product stack
# ─────────────────────────────────────────────────────────────────────────────
# One deployment for the whole product:
#   camera-mgmt  (services/camera-mgmt) — registry + ONVIF discovery API, relay ctl
#   nvr          (services/nvr)         — recording + clip/snapshot retrieval
#   mediamtx                            — single camera pull, fan-out relay
#   keycloak                            — OIDC identity (single login)
#   postgres / redis                    — persistence + ephemeral state
#
# The browser only talks to the camera-mgmt API (:8091), which serves the SPA
# (repo-root frontend/), runs camera discovery natively (/api/discovery/*),
# and proxies /api/nvr/* — all behind the single Keycloak login.
# The NVR binds to 127.0.0.1 only — it has no auth of its own by design.
#
# Host networking is used for media/LAN services (mediamtx, api, nvr,
# keycloak) — RTSP and ONVIF discovery misbehave behind Docker NAT.
# ─────────────────────────────────────────────────────────────────────────────

name: variphi-vms

networks:
  vms_internal:
    driver: bridge

volumes:
  # THE FRAME TRANSPORT (broker mode). A tmpfs volume, not a disk one: these
  # are 6 MB frames rewritten twice a second per camera, and they must never
  # reach storage.
  #
  # A VOLUME RATHER THAN A SHARED IPC NAMESPACE, which was the first design
  # and failed silently. `ipc: "service:frames"` binds a consumer to the
  # broker's namespace once, at container start; restart the broker and it
  # gets a NEW namespace while every consumer keeps the dead one. Measured on
  # this appliance: after a broker restart the consumer's /dev/shm was empty,
  # the broker held five healthy rings, and SmartSearch delivered zero frames
  # indefinitely while /health still reported five rings mapped. Nothing
  # logged an error, because a consumer that cannot read a frame looks
  # exactly like a consumer under back-pressure.
  #
  # A volume has no such lifetime coupling: it outlives both containers, so
  # either side can restart and reconnect on its own. Verified here with a
  # live reader across a writer restart.
  #
  # Size tracks camera count: 5 cameras x 4 slots x 6.22 MB = 124 MB at 1080p.
  frames_shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=${FRAMES_SHM_SIZE:-256m}

  postgres_data:
  searchdb_data:
  search_crops:
  search_models:
  redis_data:
  # Heatmap overlay objects. A NAMED VOLUME on the existing Docker storage, not
  # a bind mount: MinIO needs POSIX ownership/permissions, and a /mnt/<drive>
  # bind mount on this host is drvfs, which cannot do chown — MinIO exits with
  # "Unable to initialize backend" on one (verified 2026-09-25). Sized for the
  # current test only: 5 cameras x 17 objects/day x ~300 KB is tens of MB.
  minio_data:
  # Retained device state and queued commands for the VMS broker (mqtt profile).
  mosquitto_data:
  nvr_data:
  evidence_data:
  # Data Collection frames. SEPARATE FROM evidence_data on purpose: these are
  # deletable working images for model training on an operational clock, not an
  # append-only legal register, so an operator must be able to reclaim the space
  # with `docker volume rm` without touching evidence packages.
  dataset_data:
  caddy_data:
  caddy_config:
  # Home Assistant's /config (homeassistant profile): its database, entities,
  # integrations and tokens. A named volume, never a bind mount.
  ha_config:

services:

  # ── PostgreSQL (camera registry + discovery DB + keycloak DB) ───────────────
  postgres:
    image: postgres:15-alpine
    container_name: vms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-rtsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtsp_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-rtsp_relay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtsp} -d ${POSTGRES_DB:-rtsp_relay}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Smart Search index (pgvector) — started by default ─────────────────────
  # Backs the smartsearch service below, which now starts with the stack (see
  # its comment for the history and how to opt out).
  #
  # A SECOND Postgres, deliberately, and not pgvector added to the one above:
  #
  #   * The registry runs postgres:15-alpine (musl); pgvector's images are
  #     Debian (glibc). Swapping the image under the EXISTING volume changes
  #     collation and silently invalidates its text btree indexes, the audit
  #     log's included. A new database on a new volume never has that history.
  #   * Smart Search is optional. Recording, playback and audit do not depend on
  #     it, so a deployment that does not want it simply never starts this.
  #   * It is a continuous index-heavy write workload, which does not belong
  #     next to the data that has to survive.
  #
  searchdb:
    image: pgvector/pgvector:pg15
    container_name: vms_searchdb
    # The `search` profile is ON for new installs via COMPOSE_PROFILES=search
    # in .env.example — NOT by removing the profile. Removing it was tried and
    # reverted: it force-started this database and the ~2.4 GB smartsearch
    # build on every EXISTING install's next `up` (aborting the whole `up` on
    # an air-gapped box), while those installs' .env files still carried the
    # old example's explicit-empty SMARTSEARCH URLs — so the stack ran idle
    # and unconfigured. Profile + .env default gives both: turnkey on a fresh
    # clone, unchanged behaviour on upgrade until the operator opts in.
    profiles: ["search"]
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${SEARCHDB_USER:-search}
      POSTGRES_PASSWORD: ${SEARCHDB_PASSWORD:-search_secret}
      POSTGRES_DB:       ${SEARCHDB_NAME:-smartsearch}
    volumes:
      - searchdb_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SEARCHDB_PORT:-5434}:5432"
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEARCHDB_USER:-search} -d ${SEARCHDB_NAME:-smartsearch}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Valkey (stream health / backoff / locks) ────────────────────────────────
  # Valkey, not Redis: Redis relicensed at 7.4 to RSALv2 + SSPLv1, neither of
  # which is OSI-approved, so redistributing it would make the bundle
  # not-open-source. Valkey is the BSD-3 fork and speaks the same protocol —
  # the service name, REDIS_URL and the redis:// scheme are unchanged.
  #
  # NOT a hot swap on an existing appliance: Valkey 8 refuses Redis 7.4's RDB
  # ("Can't handle RDB format version 12") and exits. Run
  # scripts/redis-to-valkey.sh before switching, or start from an empty volume.
  redis:
    image: valkey/valkey:8-alpine
    container_name: vms_redis
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3 object store for heatmap overlay artifacts) ───────────────────
  # BUILT LOCALLY, BY COMPOSE — see deploy/minio/Dockerfile for why. MinIO
  # withdrew its public images (minio/minio refuses pulls on Docker Hub; quay.io
  # and registry.min.io have none), so the Dockerfile lifts the binary out of a
  # digest-pinned public build and packages it. `./vms build` builds it, and
  # `./vms up` builds it on a fresh host where the image does not exist yet.
  #
  # THE S3 PORT IS PUBLISHED ON LOOPBACK, and it has to be. The api runs with
  # `network_mode: host` (as 14 services here do), so it is NOT on vms_internal:
  # from host networking the name `minio` does not resolve and a bridge-only 9000
  # is unreachable. Publishing 9000 on 127.0.0.1 is what lets the api reach the
  # store, while keeping it off every external interface -- same posture as the
  # console. Containers that ARE on vms_internal (minio_init) still use
  # http://minio:9000 directly and do not go through the published port.
  #
  # The host port is ${MINIO_API_PORT:-9000} so a host that already runs another
  # MinIO on 9000 can move it. The api's HEATMAP_S3_ENDPOINT default is built
  # from the SAME variable, so the two cannot drift apart -- only an explicit
  # HEATMAP_S3_ENDPOINT override in .env would decouple them.
  minio:
    build:
      context: deploy/minio
    image: minio-community:local
    container_name: vms_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── MinIO bucket bootstrap (one-shot, idempotent, runs on every `up`) ───────
  # Uses the API image because it already carries boto3 (a camera-mgmt
  # dependency for the dataset S3 mirror) — no `mc` client, which is equally
  # unpullable, and no extra image to maintain. Creating a bucket that already
  # exists is a no-op, so this is safe to re-run for ever.
  minio_init:
    image: variphi-vms-api
    # Never pulled: this tag is built locally by `api`, and does not exist in any
    # registry. Without this, a fresh host's `up` tries to pull it before it has
    # built anything and aborts every other image with "pull access denied".
    pull_policy: never
    container_name: vms_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # PINNED, not ${HEATMAP_S3_ENDPOINT}: this container sits on vms_internal
      # and reaches MinIO by container name. The api's endpoint is a loopback
      # address that would resolve here to this container itself.
      HEATMAP_S3_ENDPOINT:   http://minio:9000
      HEATMAP_S3_BUCKET:     ${HEATMAP_S3_BUCKET:-vms-heatmaps}
      HEATMAP_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      HEATMAP_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: ["python3", "-c"]
    command:
      - |
        import os, boto3, botocore
        s3 = boto3.client("s3", endpoint_url=os.environ["HEATMAP_S3_ENDPOINT"],
                          aws_access_key_id=os.environ["HEATMAP_S3_ACCESS_KEY"],
                          aws_secret_access_key=os.environ["HEATMAP_S3_SECRET_KEY"],
                          region_name="us-east-1",
                          config=botocore.config.Config(signature_version="s3v4"))
        b = os.environ["HEATMAP_S3_BUCKET"]
        try:
            s3.create_bucket(Bucket=b); print(f"minio_init: created bucket {b}")
        except s3.exceptions.BucketAlreadyOwnedByYou:
            print(f"minio_init: bucket {b} already exists")
        except s3.exceptions.BucketAlreadyExists:
            print(f"minio_init: bucket {b} already exists")
        print("minio_init: buckets =", [x["Name"] for x in s3.list_buckets()["Buckets"]])
    networks:
      - vms_internal

  # ── MediaMTX (single camera pull → RTSP/HLS fan-out) ────────────────────────
  mediamtx:
    # -ffmpeg variant, same 1.9.1 server. FFmpeg is needed on PATH for the
    # per-camera re-stamp hop the health monitor enables when a recorder emits
    # a backward timestamp jump (services/relay.py::_restamp_command). Only
    # flagged cameras spawn a process; the plain image would leave the hop
    # silently dead with "runOnInit: ffmpeg: not found".
    image: bluenviron/mediamtx:1.9.1-ffmpeg
    container_name: vms_mediamtx
    restart: unless-stopped
    network_mode: host
    environment:
      MTX_LOGLEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    # Binds :8654 (RTSP), :8322 (RTSPS), :8988 (HLS), :8889 (WebRTC/WHEP),
    # :8189 (WebRTC ICE/UDP), :9987 (API), :9988 (metrics)

  # ── Keycloak DB bootstrap (one-shot, idempotent) ────────────────────────────
  keycloak_db_init:
    image: postgres:15-alpine
    container_name: vms_keycloak_db_init
    network_mode: host
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-rtsp_secret}
    command:
      - "sh"
      - "-c"
      - >
        psql -h 127.0.0.1 -p ${POSTGRES_PORT:-5433} -U ${POSTGRES_USER:-rtsp}
        -d ${POSTGRES_DB:-rtsp_relay}
        -tc "SELECT 1 FROM pg_database WHERE datname='keycloak'" | grep -q 1 ||
        createdb -h 127.0.0.1 -p ${POSTGRES_PORT:-5433} -U ${POSTGRES_USER:-rtsp} keycloak
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Keycloak (OIDC identity provider — the single login) ────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vms_keycloak
    restart: unless-stopped
    network_mode: host
    # PRODUCTION mode ("start", not "start-dev"). start-dev enables Keycloak's
    # development profile — relaxed hostname handling, dev-only caching, and a
    # banner telling you not to run it in production — which is not what should
    # be authenticating a compliance appliance, however well it happens to work.
    # Plain HTTP is still allowed on purpose (KC_HTTP_ENABLED below): this is a
    # LAN appliance reached by IP, and demanding TLS by default would lock an
    # operator out of a box they just installed. See HARDENING.md for the TLS
    # path (the `tls` Caddy profile) and for what that default costs.
    command: ["start", "--import-realm", "--http-port=${KEYCLOAK_PORT:-8085}"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB:          postgres
      KC_DB_URL:      jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:-5433}/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-rtsp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-rtsp_secret}
      KC_HTTP_ENABLED:      "true"
      KC_HOSTNAME_STRICT:   "false"
      KC_PROXY_HEADERS:     "xforwarded"
      KC_HEALTH_ENABLED:    "true"
      # Host-networked: default mgmt port 9000 collides with MinIO; move it (2026-08-03)
      KC_HTTP_MANAGEMENT_PORT: "9005"
    volumes:
      - ./deploy/keycloak/realm-vms.json:/opt/keycloak/data/import/realm-vms.json:ro
      - ./deploy/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak_db_init:
        condition: service_completed_successfully

  # ── Keycloak client sync (one-shot, idempotent, runs on every `up`) ─────────
  # Realm import happens only on Keycloak's FIRST boot, so deployments that
  # imported an older realm-vms.json keep its client config forever (e.g. the
  # webOrigins="+" combo whose broken CORS surfaces as "Login failed:
  # undefined"). This re-asserts the vms-web client's redirect/origin settings
  # against the RUNNING Keycloak; non-fatal and a no-op when already in sync.
  keycloak_client_sync:
    image: python:3.11-slim
    container_name: vms_keycloak_client_sync
    network_mode: host
    environment:
      KC_URL:                  http://127.0.0.1:${KEYCLOAK_PORT:-8085}
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Same BRAND_NAME the SPA is built with. The login page renders the
      # REALM's displayName, which realm-vms.json only sets on a first-boot
      # import — so an existing realm keeps the old name forever unless this
      # sync reconciles it on every `up`. Unset = leave the realm alone.
      BRAND_NAME:              ${BRAND_NAME:-}
      # The SEEDED APPLICATION LOGINS. realm-vms.json has to ship a working
      # user or a fresh appliance cannot be signed into at all; these retire
      # its hardcoded `admin`/`admin` and `operator`/`operator` on the first
      # `up`. Generated by scripts/gen-secrets.sh — see sync_seed_passwords().
      VMS_ADMIN_PASSWORD:      ${VMS_ADMIN_PASSWORD:-}
      VMS_OPERATOR_PASSWORD:   ${VMS_OPERATOR_PASSWORD:-}
      KC_REMEMBER_ME_DAYS:         ${KC_REMEMBER_ME_DAYS:-30}
    volumes:
      - ./deploy/keycloak/sync-client.py:/sync-client.py:ro
    command: ["python3", "/sync-client.py"]
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  # ── Camera-management API + unified SPA ─────────────────────────────────────
  api:
    build:
      # Context is the repo root so the build can copy both the backend
      # (services/camera-mgmt) and the unified SPA (frontend/ at the top level).
      context: .
      dockerfile: services/camera-mgmt/Dockerfile.backend
      network: host
      # Branding is compiled INTO the SPA bundle, so it has to be a build arg —
      # setting these in `environment:` below would reach the running container
      # long after Vite has finished. Change BRAND_NAME in .env, then rebuild
      # (`./vms build api`) for it to take effect in the UI. The login page
      # tracks the same value at runtime via keycloak_client_sync.
      args:
        VITE_BRAND_NAME: ${BRAND_NAME:-}
        VITE_BRAND_SITE: ${BRAND_SITE:-}
        VITE_SOURCE_URL: ${SOURCE_URL:-}
    container_name: vms_api
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_IP:               ${SERVER_IP:-127.0.0.1}
      RTSP_PORT:               ${RTSP_PORT:-8654}
      API_PORT:                ${API_PORT:-8091}
      DATABASE_URL:            ${DATABASE_URL:-postgresql+asyncpg://rtsp:rtsp_secret@127.0.0.1:5433/rtsp_relay}
      REDIS_URL:               ${REDIS_URL:-redis://127.0.0.1:6380/0}
      MEDIAMTX_API_URL:        ${MEDIAMTX_API_URL:-http://127.0.0.1:9987}
      RELAY_INTERNAL_HOST:     ${RELAY_INTERNAL_HOST:-127.0.0.1}
      MAX_TRANSCODE_WORKERS:   ${MAX_TRANSCODE_WORKERS:-8}
      LOG_LEVEL:               ${LOG_LEVEL:-info}
      HEALTH_POLL_INTERVAL:    ${HEALTH_POLL_INTERVAL:-30}
      # Local wall clock for recording-schedule windows and report timestamps
      # (must match the NVR's TZ so schedules line up with segment filenames).
      TZ:                      ${TZ:-UTC}
      # Optional outbound integrations: no destination is created or enabled by these defaults.
      EVENTS_ENABLED:          ${EVENTS_ENABLED:-true}
      EVENTS_PUBLIC_BASE_URL:  ${EVENTS_PUBLIC_BASE_URL:-}
      EVENTS_DEPLOYMENT_ID:    ${EVENTS_DEPLOYMENT_ID:-vms}
      EVENTS_RETENTION_DAYS:   ${EVENTS_RETENTION_DAYS:-7}
      EVENTS_INCLUDE_PLATES:   ${EVENTS_INCLUDE_PLATES:-false}
      EVENTS_ROUTER_INTERVAL_S: ${EVENTS_ROUTER_INTERVAL_S:-1}
      EVENTS_SENDER_INTERVAL_S: ${EVENTS_SENDER_INTERVAL_S:-1}
      EVENTS_LEASE_S:          ${EVENTS_LEASE_S:-60}
      SITE_TIMEZONE:           ${SITE_TIMEZONE:-UTC}
      # ── Identity (OIDC / Keycloak) ──
      DEV_AUTH:                ${DEV_AUTH:-false}
      OIDC_ISSUER:             ${OIDC_ISSUER:-http://localhost:8085/realms/vms}
      # Empty = SPA derives Keycloak's URL from the browser host (turnkey).
      OIDC_PUBLIC_URL:         ${OIDC_PUBLIC_URL:-}
      # Per-front-door Keycloak URLs (app_host=auth_url,…) for reverse-proxy /
      # tunnel access where :8085 isn't forwarded. Empty = turnkey everywhere.
      OIDC_PUBLIC_HOSTS:       ${OIDC_PUBLIC_HOSTS:-}
      KEYCLOAK_PORT:           ${KEYCLOAK_PORT:-8085}
      OIDC_JWKS_URL:           ${OIDC_JWKS_URL:-http://127.0.0.1:8085/realms/vms/protocol/openid-connect/certs}
      OIDC_CLIENT_ID:          ${OIDC_CLIENT_ID:-vms-web}
      OIDC_AUDIENCE:           ${OIDC_AUDIENCE:-}
      CORS_ORIGINS:            ${CORS_ORIGINS:-}
      # ── Camera discovery (native ONVIF scan/probe, /api/discovery/*) ──
      DISCOVERY_SECRET_KEY:    ${DISCOVERY_SECRET_KEY:-dev-insecure-change-me}
      # Rare escape hatch: extra auto-scan sweep CIDRs for routed camera VLANs
      # no automatic source (interfaces, camera registry) can see. Normally empty.
      DISCOVERY_SUBNETS:       ${DISCOVERY_SUBNETS:-}
      # ── NVR service (proxied behind the single login) ──
      NVR_API_URL:             ${NVR_API_URL:-http://127.0.0.1:8009}
      NVR_RECORD_HOST:         ${NVR_RECORD_HOST:-127.0.0.1}
      NVR_DEFAULT_RETENTION_DAYS: ${NVR_DEFAULT_RETENTION_DAYS:-30}
      # Canonical unit. Unset = the day value above, converted. See .env.example.
      NVR_RETENTION_MINUTES:   ${NVR_RETENTION_MINUTES:-}
      NVR_SUB_RETENTION_MINUTES: ${NVR_SUB_RETENTION_MINUTES:-}
      NVR_SYNC_ENABLED:        ${NVR_SYNC_ENABLED:-true}
      NVR_SYNC_INTERVAL:       ${NVR_SYNC_INTERVAL:-60}
      # ── Motion service (proxied behind the single login) ──
      MOTION_API_URL:          ${MOTION_API_URL:-http://127.0.0.1:8012}
      MOTION_SYNC_ENABLED:     ${MOTION_SYNC_ENABLED:-true}
      # ── Frame broker and analytics (--profile frames / --profile analytics) ──
      # WHAT TURNS THE SYNC ON. The broker's camera set is in-memory and
      # nothing pushes to it by default, so without these URLs it decodes
      # nothing and every consumer waits on notices that never arrive — the
      # analytics detector included. Setting them starts the registry->broker
      # and registry->analytics reconcile loops alongside the NVR, motion and
      # Smart Search ones.
      #
      # Harmless when those profiles are not running: each loop reports the
      # service unreachable and retries, exactly as the others do.
      FRAMES_API_URL:          ${FRAMES_API_URL:-http://127.0.0.1:8014}
      ANALYTICS_API_URL:       ${ANALYTICS_API_URL:-http://127.0.0.1:8015}
      # ── Smart Search index (proxied behind the single login) ──
      # Defaults to the co-located smartsearch service below, so a first start
      # is searchable out of the box. `${VAR-default}` (unset-only), NOT
      # `${VAR:-default}`: an EXPLICIT empty value in .env still means "this
      # VMS has no index" — a supported deployment (the Smart Search page says
      # so and the rest of the product is unaffected) — while merely not
      # mentioning the variable gets the turnkey default. Unlike motion/nvr the
      # index need not be co-located; on some sites it is a separate GPU host,
      # so this may be a remote URL.
      # ── The peripherals bridge (P2) ──
      # PASSED THROUGH EXPLICITLY OR THE OFF SWITCH DOES NOT EXIST: this
      # service reads its own environment and has no env_file, so a value set
      # in .env alone would reach nothing. Same trap as
      # ANALYTICS_FACE_AUTO_DOWNLOAD further down.
      #
      # Every default is empty/off, so an appliance with no broker reports
      # `not_configured` — a supported deployment, and a different fact from
      # `offline`.
      MQTT_URL:                ${MQTT_URL:-}
      MQTT_USERNAME:           ${MQTT_USERNAME:-}
      MQTT_PASSWORD:           ${MQTT_PASSWORD:-}
      MQTT_TLS_VERIFY:         ${MQTT_TLS_VERIFY:-true}
      MQTT_TOPIC_PREFIX:       ${MQTT_TOPIC_PREFIX:-vms}
      HA_URL:                  ${HA_URL:-}
      HA_TOKEN:                ${HA_TOKEN:-}
      BRIDGE_VERIFY_INTERVAL_S: ${BRIDGE_VERIFY_INTERVAL_S:-300}
      BRIDGE_STATE_STALE_S:    ${BRIDGE_STATE_STALE_S:-300}
      SMARTSEARCH_API_URL:     ${SMARTSEARCH_API_URL-http://127.0.0.1:8013}
      SMARTSEARCH_API_KEY:     ${SMARTSEARCH_API_KEY:-}
      # The WRITE side — which index this VMS feeds cameras to. Same
      # unset-vs-empty rule as the query URL above.
      SMARTSEARCH_INDEX_URL:   ${SMARTSEARCH_INDEX_URL-http://127.0.0.1:8013}
      # ── User management (Keycloak Admin REST API) ──
      KEYCLOAK_ADMIN_URL:      ${KEYCLOAK_ADMIN_URL:-http://127.0.0.1:8085}
      KEYCLOAK_ADMIN_USER:     ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      INTERNAL_API_KEY:        ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      # ── DeepStream analytics pipeline (same appliance, HTTP) ──
      # Each camera's full config envelope is POSTed to the pipeline's control
      # API (services/deepstream_client.py); the pipeline writes and owns its
      # own config files, so there is no shared directory to mount.
      # Loopback: both are host-networked. Authenticated with INTERNAL_API_KEY.
      # OFF: AI activities execute on the CPU Activity Engine in `analytics`.
      # DeepStream stays in the tree; set true to push cameras to it again.
      DEEPSTREAM_SYNC_ENABLED:  ${DEEPSTREAM_SYNC_ENABLED:-false}
      DEEPSTREAM_API_URL:       ${DEEPSTREAM_API_URL:-http://127.0.0.1:8081}
      DEEPSTREAM_SYNC_INTERVAL: ${DEEPSTREAM_SYNC_INTERVAL:-60}
      # Where the pipeline posts results back when it is the AI engine
      # (DEEPSTREAM_SYNC_ENABLED=true): handed to it in each camera's envelope.
      # Empty = http://127.0.0.1:<API_PORT>; set it when the pipeline runs on
      # another box.
      DEEPSTREAM_CALLBACK_URL:  ${DEEPSTREAM_CALLBACK_URL:-}
      # ── Data Collection ──────────────────────────────────────────────────
      DATASET_DIR:             ${DATASET_DIR:-/dataset-frames}
      # In-flight snapshots per dataset run. See backend/config.py.
      DATASET_SNAPSHOT_CONCURRENCY: ${DATASET_SNAPSHOT_CONCURRENCY:-2}
      # How long a LOOSE annotation's still is kept. MINUTES, the canonical
      # retention unit since migration 042 — a _DAYS knob here would reintroduce
      # the drift that change removed. Stamped at INSERT, so a change takes
      # effect for annotations created after this container restarts; existing
      # rows keep the expiry they were born with. An annotation attached to a
      # dataset never expires. See .env.example for the re-basing SQL.
      ANNOTATION_TTL_MINUTES:  ${ANNOTATION_TTL_MINUTES:-2880}
      # Must be reachable FROM THIS CONTAINER. Under network_mode: host that
      # means 127.0.0.1 for a Label Studio on this box — not a compose service
      # name, which does not resolve here.
      LABELSTUDIO_URL:         ${LABELSTUDIO_URL:-}
      LABELSTUDIO_API_KEY:     ${LABELSTUDIO_API_KEY:-}
      LABELSTUDIO_PROJECT_ID:  ${LABELSTUDIO_PROJECT_ID:-}
      # ── Heatmap object store (MinIO) ───────────────────────────────────────
      # The API is the ONLY thing that talks to the store: DeepStream posts the
      # picture to the API and the API decides where the bytes go. The keys are
      # MinIO's root credentials, taken from the same variables the minio
      # service is started with so there is one pair to rotate, not two.
      #
      # NOT in depends_on, deliberately. An unreachable store must cost a
      # heatmap upload, never the API's boot: `is_configured()` only inspects
      # this URL, the client is built on first use, and every read falls back
      # to bytes already in the row.
      HEATMAP_S3_ENDPOINT:     ${HEATMAP_S3_ENDPOINT:-http://127.0.0.1:${MINIO_API_PORT:-9000}}
      HEATMAP_S3_BUCKET:       ${HEATMAP_S3_BUCKET:-vms-heatmaps}
      HEATMAP_S3_ACCESS_KEY:   ${MINIO_ROOT_USER:-minioadmin}
      HEATMAP_S3_SECRET_KEY:   ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # ── Time-lapse (services/timelapse.py) — stills share the store above, under
      # `timelapse/`. Per-camera switches default OFF; these are appliance knobs.
      TIMELAPSE_CAPTURE_ENABLED:      ${TIMELAPSE_CAPTURE_ENABLED:-true}
      TIMELAPSE_CAPTURE_CONCURRENCY:  ${TIMELAPSE_CAPTURE_CONCURRENCY:-2}
      TIMELAPSE_RENDER_RETENTION_DAYS: ${TIMELAPSE_RENDER_RETENTION_DAYS:-30}
      TIMELAPSE_MAX_RENDER_FRAMES:    ${TIMELAPSE_MAX_RENDER_FRAMES:-20000}
      TIMELAPSE_NVENC:                ${TIMELAPSE_NVENC:-false}
      # CREDENTIALS ONLY. The destination bucket/prefix are chosen per import in
      # the UI; these two only PREFILL that form. Leave the keys blank to use an
      # instance role or a mounted ~/.aws instead.
      AWS_ACCESS_KEY_ID:       ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY:   ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION:              ${AWS_REGION:-}
      AWS_S3_BUCKET:           ${AWS_S3_BUCKET:-}
      AWS_S3_PREFIX:           ${AWS_S3_PREFIX:-}
    volumes:
      # Built evidence packages + the appliance evidence-signing key persist here.
      # Bytes are video-sized, so on a volume, not Postgres.
      - evidence_data:/evidence-exports
      - dataset_data:/dataset-frames
      # Read-only, only so the time-lapse disk guard can measure the disk the stills live on
      # (services/timelapse.disk_usage): stills must never fill it to where the NVR deletes footage.
      - minio_data:/data/timelapse-disk:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    # ONE WORKER, NOT FOUR, AND IT HAS TO STAY ONE until somebody finds the
    # actual bug. With `--workers 4` uvicorn child processes died roughly 13
    # times every 24 h on the GPU appliance -- silently: no OOM (cgroup
    # `memory.events` showed `oom_kill 0`, `memory.peak` 1.17 GB against no
    # limit), nothing in `dmesg`/`journalctl`, and no Python traceback. All the
    # log said was `Child process [PID] died`, followed by a fresh `startup.*`
    # burst from its replacement.
    #
    # That is not cosmetic, because a Data Collection run is an in-process
    # asyncio task living inside ONE worker. Kill the worker and the run dies
    # with it; `updated_at` stops moving; ten minutes later `_reap_if_stale`
    # (routers/datasets.py) flips the row to `failed`. Datasets 15, 16 and 17
    # all died that way, each reaped ~10 min after a logged child death.
    #
    # DO NOT DEBUG THIS FROM `docker inspect`: RestartCount stays 0 throughout,
    # because the *container* never restarts -- only its children do. The
    # signal is `Child process .* died` in the logs.
    #
    # Evidence for the change (2026-10-09..12): 60 h on one worker produced
    # zero deaths, and four collections completed back to back -- including
    # 6,358 scans keeping 500 frames (dataset 19), a far heavier run than
    # either of the ones that died under four workers.
    #
    # The cost is real: a quarter of the request concurrency. Raise it again
    # only together with a fix for the deaths, or by moving collection out of
    # the request workers onto a queue so a recycled worker stops being fatal.
    command: ["/bin/sh", "-c", "python -m backend.migrate && uvicorn backend.main:app --host 0.0.0.0 --port ${API_PORT:-8091} --workers 1 --loop uvloop --access-log"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${API_PORT:-8091}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── NVR (recording + retrieval) ─────────────────────────────────────────────
  # Records every enabled camera FROM THE RELAY (rtsp://<host>:8654/<slug>) so
  # each physical camera is still pulled exactly once. Cameras are synced into
  # it at runtime by the camera-mgmt API (create/delete + 60s reconcile) — do
  # not hand-edit cameras.yaml for registry cameras.
  # SECURITY: the NVR has no auth of its own; it binds to 127.0.0.1 only and is
  # reached by users exclusively through the API's authenticated /api/nvr proxy.
  nvr:
    build:
      context: ./services/nvr
      network: host
    container_name: vms_nvr
    restart: unless-stopped
    network_mode: host
    # Default bind is loopback (users go through the authenticated /api/nvr
    # proxy). Set NVR_BIND_HOST=0.0.0.0 ONLY if legacy LAN consumers (e.g. a
    # clip-service on another host/bridge network) must call the NVR directly —
    # that re-exposes the unauthenticated NVR API to the LAN.
    command: ["--config", "config/cameras.yaml", "--host", "${NVR_BIND_HOST:-127.0.0.1}", "--port", "${NVR_PORT:-8009}"]
    environment:
      TZ: ${TZ:-UTC}
      # Hard cap on total footage (GB); oldest segments are deleted once
      # exceeded. Empty = uncapped (age-based retention only).
      NVR_MAX_STORAGE_GB: ${NVR_MAX_STORAGE_GB:-}
      # State-change notifications for disk/cap pressure. Empty = log only.
      # Kill switch for the GPU encoder (api/encoders.py). Documented there but
      # previously unreachable from compose, so the CPU fallback could not be
      # exercised on a box that has a working GPU. Set to 1 to force libx264.
      NVR_DISABLE_NVENC:          ${NVR_DISABLE_NVENC:-}
      NVR_ALERT_WEBHOOK_URL:      ${NVR_ALERT_WEBHOOK_URL:-}
      NVR_ALERT_INTERVAL_SECONDS: ${NVR_ALERT_INTERVAL_SECONDS:-60}
      # Seconds one snapshot ffmpeg may run before it is killed.
      NVR_SNAPSHOT_TIMEOUT:       ${NVR_SNAPSHOT_TIMEOUT:-45}
    volumes:
      - nvr_data:/data/nvr
      - ./services/nvr/config:/app/config:ro
    depends_on:
      - mediamtx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8009/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frame broker (Phase 1 — OPT-IN, nothing consumes it yet) ───────────────
  #   ./vms --profile frames up -d frames
  #
  # Decodes each camera ONCE, writes the frame to shared memory, runs the
  # CANONICAL motion analysis, and publishes a notice per frame. Both the
  # Motion service and SmartSearch are meant to become consumers, so they see
  # the SAME pixels — which two independent decoders can never guarantee, and
  # which is why regions computed by one cannot be trusted by the other.
  #
  # BEHIND A PROFILE ON PURPOSE. Phase 1 ships the producer only: it runs
  # beside the existing stack, changes nothing, and is verified by
  # services/frames/scripts/parity.py reproducing the SmartSearch gate's
  # regions exactly on the same frames. Consumers switch over in later phases.
  frames:
    build:
      context: ./services/frames
      network: host
    container_name: vms_frames
    profiles: ["frames"]
    restart: unless-stopped
    environment:
      FRAMES_BIND_HOST: 127.0.0.1
      FRAMES_PORT: ${FRAMES_PORT:-8014}
      # The one place the sample rate is decided, once consumers read from here.
      FRAMES_SAMPLE_FPS: ${FRAMES_SAMPLE_FPS:-5}
      FRAMES_RING_SLOTS: ${FRAMES_RING_SLOTS:-4}
      # FFmpeg decode threads per camera (0 = auto, one per core).
      FRAMES_DECODE_THREADS: ${FRAMES_DECODE_THREADS:-1}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6380/0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Where the rings are written. See the volumes block for why this is a
      # shared tmpfs volume and not this container's own /dev/shm.
      FRAMES_SHM_DIR: /frames
    # SHARED MEMORY IS THE POINT. Consumers mount the same volume at the same
    # path. A container's own /dev/shm cannot serve: it is private, and
    # joining the broker's IPC namespace to share it does not survive the
    # broker restarting.
    volumes:
      - frames_shm:/frames
    depends_on:
      redis:
        condition: service_healthy
    # HOST NETWORKING, like every other service the api has to reach. On the
    # vms_internal bridge this bound 127.0.0.1 INSIDE its own namespace and
    # published no ports, so nothing could reach it — not the api on the host
    # netns, and not analytics on the same bridge. The registry->broker sync
    # therefore never ran and the broker decoded nothing, which is what left
    # Smart Search with an empty index while every container reported healthy.
    # The bridge overlay resets this (see docker-compose.bridge.yml).
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8014/health',timeout=4).status==200 else 1)\""]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s

  # ── Analytics (--profile analytics) ─────────────────────────────────────────
  #   ./vms --profile analytics --profile frames up -d analytics
  #
  # DETECTION, PLATES, TRACKING. Objects and number plates are found here, and
  # the indexing policy decides which observations deserve a record. It
  # produces crops and metadata; embedding, deduplication, storage and search
  # stay in Smart Search, which is what keeps that service to one job.
  #
  # WHY A SEPARATE IMAGE. This one carries ultralytics, OpenVINO and the plate
  # models; Smart Search carries the CLIP encoder. Split, neither pays for the
  # other's weights, and a future AI feature lands here without touching the
  # index.
  #
  # PHASE A SHIPS IT WITH NO SINK. ANALYTICS_SINK_URL is empty, so it detects,
  # tracks and decides, reports the counts on /health, and sends nothing
  # anywhere. That is what makes it safe to run beside the pipeline it will
  # eventually take over from.
  analytics:
    build:
      context: ./services/analytics
      network: host
    container_name: vms_analytics
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      ANALYTICS_BIND_HOST: ${ANALYTICS_BIND_HOST:-127.0.0.1}
      ANALYTICS_PORT: ${ANALYTICS_PORT:-8015}
      # broker | sampler. Broker is the default: this service is new, so there
      # is no legacy decoder to preserve.
      ANALYTICS_FRAME_SOURCE: ${ANALYTICS_FRAME_SOURCE:-broker}
      # The broker's rate, so the detector-capacity estimate counts frames the
      # broker actually sends (analytics/capacity.py). One setting, not two.
      ANALYTICS_CAPACITY_CAMERA_FPS: ${FRAMES_SAMPLE_FPS:-5}
      ANALYTICS_SHM_DIR: /frames
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6380/0}
      ANALYTICS_DETECTOR_BACKEND: ${ANALYTICS_DETECTOR_BACKEND:-auto}
      # ONE OBJECT MUST NOT BECOME TWO. Same-domain boxes nested inside one
      # another — a torso inside a full body — are collapsed to the outer box
      # before the tracker or appearance dedup can treat them as two objects.
      # This is the containment at which that happens; 0 turns it off so an
      # operator can compare without a rebuild.
      #
      # It has to be passed through HERE or that off switch does not exist:
      # the service reads its own environment, and there is no env_file, so a
      # value set in .env reached nothing. The default mirrors
      # services/analytics/config.yaml — change both together, which
      # tests/test_compose_defaults.py enforces.
      ANALYTICS_NESTED_CONTAINMENT: ${ANALYTICS_NESTED_CONTAINMENT:-0.9}
      # The detector's confidence floor, for every camera and both detection
      # paths. Passed through so it can be tuned from .env without a rebuild;
      # the default mirrors services/analytics/config.yaml (detect.confidence).
      ANALYTICS_DETECT_CONFIDENCE: ${ANALYTICS_DETECT_CONFIDENCE:-0.4}
      # WHERE ACCEPTED OBSERVATIONS GO. Defaulted ON, and the pairing that
      # governs it is the reason why.
      #
      # The sink and Smart Search's own detector are a PAIR: with both live,
      # every object is recorded TWICE — once by each path — and appearance
      # dedup absorbs some of that and not all, because the two carry
      # different tracker ids. That is why this shipped empty.
      #
      # It no longer holds. SEARCH_FRAME_SOURCE now defaults to `none` (see
      # the smartsearch service below), so Smart Search does NOT detect by
      # default and analytics is the only detector there is. Leaving the sink
      # empty then means the other half of the pair — nothing detects at all,
      # the index never grows, and every service still reports healthy. That
      # is exactly what a clean install did.
      #
      # If you deliberately switch Smart Search's own detector back on
      # (SEARCH_FRAME_SOURCE=broker), clear this in the same change.
      ANALYTICS_SINK_URL: ${ANALYTICS_SINK_URL:-http://127.0.0.1:8013}
      # HOW LONG THE WEIGHTS SURVIVE WITH NO CAMERA ASKING FOR DETECTION.
      # The detector and the plate reader are ingest-only: they load on the
      # first camera and go when the last one does, so switching Person,
      # Vehicles and ANPR off across the fleet actually gives the memory back.
      # The timer is a DEBOUNCE — camera-mgmt reconciles from every uvicorn
      # worker and a domain change is a remove followed by an add, so the
      # count touches zero on ordinary traffic. 0 = load once, hold for ever.
      ANALYTICS_IDLE_TIMEOUT_SECONDS: ${ANALYTICS_IDLE_TIMEOUT_SECONDS:-300}
      # THE FACE MODELS FETCH THEMSELVES on first use, like the detector and
      # the plate models. Set false on an air-gapped site that stages the two
      # OpenCV Zoo .onnx files into the models volume by hand; face search then
      # reports itself unavailable until they appear, exactly as before.
      #
      # Passed through HERE or the off switch does not exist: this service
      # reads its own environment and there is no env_file, so a value set in
      # .env alone would reach nothing — the same trap as
      # ANALYTICS_NESTED_CONTAINMENT above.
      ANALYTICS_FACE_AUTO_DOWNLOAD: ${ANALYTICS_FACE_AUTO_DOWNLOAD:-true}
      # WHERE CPU ACTIVITY EVENTS GO. The activity engine (analytics/activities/)
      # runs on this service's detections and tracks and POSTs every event to
      # the VMS ingest, /api/analytics/events on the api — the table the Events
      # page reads. The API root, host-networked like this service; the key is
      # the api's own INTERNAL_API_KEY, so the two always agree.
      ANALYTICS_EVENTS_URL: ${ANALYTICS_EVENTS_URL:-http://127.0.0.1:${API_PORT:-8091}}
      ANALYTICS_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The same weights Smart Search already downloaded. Sharing the volume
      # means the detector is not fetched twice.
      - search_models:/models
      # Frames from the broker. Same tmpfs both sides mount, never an IPC
      # namespace — see the volumes block.
      - frames_shm:/frames
    depends_on:
      redis:
        condition: service_healthy
    # HOST NETWORKING — see the frames service. Analytics additionally has to
    # POST observations to Smart Search, which is host-networked, so on the
    # bridge it could not reach its own sink even once the sink was configured.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8015/health',timeout=4).status==200 else 1)\""]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 40s

  # ── MQTT broker (--profile mqtt): the bus between the bridge and devices ───
  #   COMPOSE_PROFILES=...,mqtt   with MQTT_USERNAME / MQTT_PASSWORD in .env
  #
  # THE VMS'S OWN BROKER, for a site that has no Home Assistant with one. The
  # peripherals bridge publishes commands and subscribes to state here; the
  # mqtt-modbus translator (below) or an HA on this box does the other half.
  # A site whose HA already runs a broker points MQTT_URL at that instead and
  # leaves this profile off.
  #
  # BOUND TO 127.0.0.1, PASSWORD ONLY, PERSISTENT. A broker on every interface
  # with anonymous access is a remote switch for every relay behind it — and
  # that is exactly the apt-package default (`listener 1883 0.0.0.0` +
  # `allow_anonymous true`), so this does not use the host's mosquitto even
  # when one is installed. Persistence keeps retained device state across a
  # restart, so the wall does not come back `unknown` for every device.
  #
  # The config and password file are rendered from .env at start by
  # deploy/mosquitto/entrypoint.sh; there is nothing to edit in the container.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: vms_mosquitto
    profiles: ["mqtt"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/vms-entrypoint.sh"]
    environment:
      MQTT_PORT:     ${MQTT_PORT:-1883}
      MQTT_BIND:     ${MQTT_BIND:-127.0.0.1}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      # Set to open a TLS listener on every interface for off-host clients;
      # needs server.crt/server.key in deploy/mosquitto/certs/.
      MQTT_TLS_PORT: ${MQTT_TLS_PORT:-}
    volumes:
      - ./deploy/mosquitto/entrypoint.sh:/vms-entrypoint.sh:ro
      - ./deploy/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    # Host networking, like everything the api reaches on 127.0.0.1.
    network_mode: host
    healthcheck:
      # Authenticated, so it also proves the rendered password file works.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p \"$$MQTT_PORT\" -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 10s

  # ── mqtt-modbus (--profile modbus): one coil on an RS-485 relay board ──────
  #   COMPOSE_PROFILES=...,modbus   with MQTT_URL and the MODBUS_* block in .env
  #
  # THE TRANSLATOR BETWEEN THE VMS AND A RELAY. The VMS speaks only MQTT (its
  # peripherals bridge, above); this subscribes to one command topic, writes
  # one Modbus RTU coil, and publishes the coil's state back. For a single
  # siren it replaces Home Assistant; for a site with a gate and meters, swap
  # it for HA and the VMS side does not change.
  #
  # NO SERIAL DEVICE HERE, on purpose. Compose refuses to start a container
  # whose mapped device does not exist on the host, and with MODBUS_DRY_RUN=1
  # there is none: the whole chain — rule -> alert -> MQTT -> here -> state ->
  # wall — runs and logs "would write coil 0 = ON" before a wire is connected.
  # The device mapping lives in docker-compose.modbus.yml, which ./vms adds by
  # itself once MODBUS_PORT names a path that exists.
  #
  # SAFETY. MODBUS_MAX_ON_S writes the coil OFF that long after any ON whether
  # or not an `off` arrives, and the coil is written OFF on start, on broker
  # loss and on shutdown. That is defence in depth behind the VMS's own pulse
  # follow-up — NOT a substitute for a hardware timer relay in series. See
  # services/mqtt-modbus/README.md before connecting a siren.
  mqtt-modbus:
    build:
      context: ./services/mqtt-modbus
      network: host
    container_name: vms_mqtt_modbus
    profiles: ["modbus"]
    restart: unless-stopped
    environment:
      # The same broker the VMS bridge publishes to.
      MQTT_URL:             ${MQTT_URL:-}
      MQTT_USERNAME:        ${MQTT_USERNAME:-}
      MQTT_PASSWORD:        ${MQTT_PASSWORD:-}
      MQTT_TLS_VERIFY:      ${MQTT_TLS_VERIFY:-true}
      MODBUS_DRY_RUN:       ${MODBUS_DRY_RUN:-1}
      MODBUS_PORT:          ${MODBUS_PORT:-/dev/ttyUSB0}
      MODBUS_BAUD:          ${MODBUS_BAUD:-9600}
      MODBUS_SLAVE_ID:      ${MODBUS_SLAVE_ID:-1}
      MODBUS_COIL:          ${MODBUS_COIL:-0}
      MODBUS_MAX_ON_S:      ${MODBUS_MAX_ON_S:-60}
      # These two are the binding's `address` and `state_topic`, exactly.
      MODBUS_COMMAND_TOPIC: ${MODBUS_COMMAND_TOPIC:-vms/siren/site-siren/set}
      MODBUS_STATE_TOPIC:   ${MODBUS_STATE_TOPIC:-vms/siren/site-siren/state}
      LOG_LEVEL:            ${LOG_LEVEL:-info}
    # Host networking, like everything else that talks to a 127.0.0.1 broker.
    network_mode: host
    # No HTTP. The translator touches a heartbeat file on every message and
    # on every (re)connect; older than two minutes means it is not serving.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.stat('/tmp/mqtt-modbus.heartbeat').st_mtime < 120 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Device gateway (COMPOSE_PROFILES=...,gateway) ───────────────────────────
  # The VMS's Webhook driver calls this; this speaks each device's own protocol
  # (Modbus RTU-over-TCP relay boards, multicast paging speakers). One URL per
  # device: POST switches it, GET is a read-only health check the bridge runs
  # every BRIDGE_VERIFY_INTERVAL_S and shows on the device wall. A new protocol
  # is a new module here, not a VMS change. services/device-gateway/README.md.
  # SECURITY: no auth of its own; binds 127.0.0.1 and is reached only by the
  # api (host network) — nothing else on the LAN can switch a device through it.
  device-gateway:
    build:
      context: ./services/device-gateway
      network: host
    container_name: vms_device_gateway
    profiles: ["gateway"]
    restart: unless-stopped
    network_mode: host
    environment:
      GATEWAY_BIND: ${GATEWAY_BIND:-127.0.0.1}
      GATEWAY_PORT: ${GATEWAY_PORT:-8099}
      GATEWAY_MULTICAST_IF: ${GATEWAY_MULTICAST_IF:-}
      GATEWAY_DEFAULT_SOUND: ${GATEWAY_DEFAULT_SOUND:-tone}
      GATEWAY_RELAY_MAX_ON_S: ${GATEWAY_RELAY_MAX_ON_S:-600}
      GATEWAY_TIMEOUT_S: ${GATEWAY_TIMEOUT_S:-1}
      GATEWAY_SOUNDS_DIR: /sounds
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${GATEWAY_SOUNDS_HOST_DIR:-./deploy/sounds}:/sounds:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('GATEWAY_PORT','8099')+'/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Home Assistant (--profile homeassistant): the executor for HA devices ───
  #   COMPOSE_PROFILES=...,homeassistant   then HA_URL=http://127.0.0.1:8123
  #
  # VMS OWNS THE RULES, HA ONLY EXECUTES. The api reaches it through the bridge's
  # homeassistant driver (POST /api/services/...); no VMS logic lives in HA's
  # YAML or automations. NOTHING may depends_on this: with the profile off, or
  # HA down, the VMS starts and runs exactly as before.
  #
  # Host networking because discovery (mDNS / SSDP / DHCP sniffing) and Modbus
  # RTU-over-TCP to LAN relay boards need it, the same reason as device-gateway;
  # Linux-only for the same reason. HA listens on 0.0.0.0:8123 until
  # `http: server_host` is set in its configuration.yaml — open it for
  # onboarding, then narrow it.
  #
  # PINNED, not :stable. HA ships monthly and renames entity ids; an appliance
  # must move only when we move it. The verify loop catches what still drifts.
  # /config is a NAMED VOLUME: back it up with the rest of the appliance.
  ha:
    image: ghcr.io/home-assistant/home-assistant:${HA_IMAGE_TAG:-2026.10.2}
    container_name: vms_ha
    profiles: ["homeassistant"]
    restart: unless-stopped
    network_mode: host
    # Bluetooth adapter management and recovery (HA raises a repair without
    # them). With host networking NET_ADMIN reaches the host's network stack,
    # which is why this is the only service granted it — and still not
    # --privileged, which HA's docs suggest and nothing here needs.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Bluetooth goes through the host's BlueZ over the system D-Bus socket
    # mounted below. Docker's default AppArmor profile (docker-default) denies
    # D-Bus messages, so HA's bluetooth integration fails with "AppArmor policy
    # prevents this sender ... AddMatch" and sits in setup_retry. Unconfined
    # AppArmor lifts only that; it is still not --privileged (no host devices,
    # no extra capabilities beyond the two above).
    security_opt:
      - apparmor:unconfined
    environment:
      TZ: ${HA_TZ:-Asia/Kolkata}
    volumes:
      - ha_config:/config
      # Bluetooth discovery; harmless without an adapter.
      - /run/dbus:/run/dbus:ro
    healthcheck:
      # /manifest.json needs no token, so this proves the HTTP server is up
      # without a credential in the compose file.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/manifest.json', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Motion detection (CPU-only, analyses relay streams) ─────────────────────
  # Watches cameras with motion_detection=true FROM THE RELAY — zero extra load
  # on the physical camera, no camera credentials. Cameras are synced in at
  # runtime by the camera-mgmt API (update hooks + 60s reconcile); state is
  # in-memory and self-heals after a restart.
  # SECURITY: no auth of its own; binds 127.0.0.1 and is reached by users
  # exclusively through the API's authenticated /api/motion proxy.
  motion:
    build:
      context: ./services/motion
      network: host
    container_name: vms_motion
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      MOTION_BIND_HOST: ${MOTION_BIND_HOST:-127.0.0.1}
      MOTION_PORT: ${MOTION_PORT:-8012}
      # capture (default) or broker — see .env.example. Operator-visible
      # behaviour is identical either way; only the source of the
      # changed-pixel fraction differs. docker-compose.broker.yml sets this
      # too, and this line is what makes the .env switch work on its own.
      MOTION_FRAME_SOURCE: ${MOTION_FRAME_SOURCE:-capture}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6380/0}
      # WHERE MOTION ACTIVITY GOES: the runs of motion the playback timeline
      # marks, posted to /api/playback/timeline/presence on the api. The API
      # root, host-networked like this service; the key is the api's own
      # INTERNAL_API_KEY, so the two always agree. Empty URL = not reported
      # (the incident log and /api/motion are unaffected either way).
      MOTION_EVENTS_URL: ${MOTION_EVENTS_URL:-http://127.0.0.1:${API_PORT:-8091}}
      MOTION_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    volumes:
      - ./services/motion/config.yaml:/app/config.yaml:ro
    depends_on:
      - mediamtx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Smart Search index (forensic person/vehicle search) ─────────────────────
  # Samples relay streams at up to 1 FPS, deduplicates by appearance and indexes
  # crops into searchdb. Same posture as motion: no camera credentials, cameras
  # pushed in at runtime by camera-mgmt's reconcile loop, in-memory state that
  # self-heals after a restart. Serves the query API the api's /api/search
  # routes proxy (person, vehicles, plates).
  #
  # Started by default ON NEW INSTALLS via COMPOSE_PROFILES=search in
  # .env.example (see searchdb's comment for why the profile itself stays):
  # since the hosted index was removed (c36ee88), a first start with no local
  # service showed "Smart Search is not configured", and the turnkey posture
  # is that every install can search its own footage. Existing installs keep
  # their prior behaviour until they add COMPOSE_PROFILES=search to .env; a
  # site that does not want the index (or uses a remote GPU host) leaves the
  # profile off and sets SMARTSEARCH_API_URL / SMARTSEARCH_INDEX_URL as
  # documented in .env.example.
  #
  # Built CPU-only by default (~2.4 GB measured). For GPU:
  #   docker compose build --build-arg TORCH_VARIANT=cu121 smartsearch
  # and the ./vms wrapper layers docker-compose.gpu-cdi.yml automatically.
  smartsearch:
    build:
      context: ./services/smartsearch
      network: host
    container_name: vms_smartsearch
    profiles: ["search"]
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      SMARTSEARCH_BIND_HOST: ${SMARTSEARCH_BIND_HOST:-127.0.0.1}
      SMARTSEARCH_PORT: ${SMARTSEARCH_PORT:-8013}
      SEARCHDB_URL: ${SEARCHDB_URL:-postgresql://search:search_secret@127.0.0.1:5434/smartsearch}
      SEARCH_CROP_DIR: ${SEARCH_CROP_DIR:-/data/search/crops}
      SEARCH_RETENTION_DAYS: ${SEARCH_RETENTION_DAYS:-30}
      # Canonical unit. Unset = the day value above, converted.
      SEARCH_RETENTION_MINUTES: ${SEARCH_RETENTION_MINUTES:-}
      # Face search's two OpenCV Zoo models, fetched on first use and verified
      # by digest. Same switch as ANALYTICS_FACE_AUTO_DOWNLOAD — both services
      # read the same shared volume, so either one fetching is enough.
      SEARCH_FACE_AUTO_DOWNLOAD: ${SEARCH_FACE_AUTO_DOWNLOAD:-true}
      # How often the service deletes expired rows and their crop files.
      # 0 disables the sweep; reads stay filtered to unexpired rows either way,
      # so the cost of disabling is disk, not wrong answers.
      SEARCH_RETENTION_SWEEP_SECONDS: ${SEARCH_RETENTION_SWEEP_SECONDS:-3600}
      SEARCH_RETENTION_ORPHAN_EVERY_N: ${SEARCH_RETENTION_ORPHAN_EVERY_N:-24}
      # Reconcile the index against what the NVR still holds, every Nth sweep.
      # Age is not the only way the index outlives its footage: the recorder and
      # the indexer restart independently, so detections accumulate over dead
      # air and their playback 404s. 0 disables it, and so does an empty
      # NVR_URL — coverage is the only thing that makes deleting by it safe, so
      # "no recorder configured" must mean "do not sweep", never "nothing is
      # recorded". A pass that would take most of one camera's rows refuses
      # itself; scripts/purge_unrecorded.py --force is the deliberate override.
      NVR_URL: http://127.0.0.1:${NVR_PORT:-8009}
      SEARCH_RETENTION_COVERAGE_EVERY_N: ${SEARCH_RETENTION_COVERAGE_EVERY_N:-24}
      # Empty = CUDA when the container can see a GPU, CPU otherwise. Set "cpu"
      # to force the fallback on a GPU host.
      SEARCH_DEVICE: ${SEARCH_DEVICE:-}
      SEARCH_INGEST_ENABLED: ${SEARCH_INGEST_ENABLED:-true}
      # Seconds with no camera registered before the detector, encoder and plate
      # reader are released. The service keeps serving searches throughout and
      # reloads in ~1.7s when a camera comes back. 0 = never release.
      SEARCH_IDLE_TIMEOUT: ${SEARCH_IDLE_TIMEOUT:-300}
      SEARCH_MOTION_GATE: ${SEARCH_MOTION_GATE:-true}
      # Square-letterbox the detector input, so an exported backend (ONNX,
      # OpenVINO) detects the same objects torch does. It also changes what the
      # CURRENT torch path detects: measured, more marginal detections at the
      # frame edge, therefore more crops, embeddings and stored rows. Set false
      # to restore the previous behaviour without a rebuild.
      # Index an object once per window rather than once per sampled second.
      # Runs before the CLIP encoder, so it removes the embedding as well as
      # the row. Measured ~80% fewer index entries at 1.1% of distinct objects
      # left unindexed. 0 disables it.
      # Sampling, tracking and indexing. Nothing here samples any more
      # (SEARCH_FRAME_SOURCE=none below): this is the rate the frame source —
      # the frames broker — is expected to run at, and /health reports it as
      # `expected_source_fps` so that a real mismatch shows up in one place.
      # It must therefore equal FRAMES_SAMPLE_FPS on the frames service;
      # tests/test_compose_defaults.py checks that it does. 5 FPS is for the
      # tracker, not for coverage: it keeps identities, it does not find more
      # objects.
      SEARCH_SAMPLE_FPS: ${SEARCH_SAMPLE_FPS:-5}
      # sampler | broker. Leave as sampler unless the frames service is up:
      # broker mode makes indexing depend on it. See services/frames.
      # `none` is the only value now: detection moved to services/analytics,
      # which posts finished observations here. Kept as a variable rather than
      # deleted so an existing .env carrying `sampler` fails with an
      # explanation at startup instead of indexing nothing quietly.
      SEARCH_FRAME_SOURCE: ${SEARCH_FRAME_SOURCE:-none}
      SEARCH_TRACKING_ENABLED: ${SEARCH_TRACKING_ENABLED:-true}
      SEARCH_TRACK_MAX_COST: ${SEARCH_TRACK_MAX_COST:-1.75}
      SEARCH_TRACK_MAX_AGE: ${SEARCH_TRACK_MAX_AGE:-3}
      # The escape hatch: false indexes every observation of every track.
      SEARCH_INDEX_SUPPRESSION_ENABLED: ${SEARCH_INDEX_SUPPRESSION_ENABLED:-true}
      SEARCH_INDEX_DISPLACEMENT: ${SEARCH_INDEX_DISPLACEMENT:-1.5}
      # 0 = off, on evidence: it fired once in 322 observations over 14
      # minutes of continuous footage. Mechanism intact; set >0 to re-enable.
      SEARCH_INDEX_HEARTBEAT: ${SEARCH_INDEX_HEARTBEAT:-0}
      # Detector implementation: auto | openvino | torch. AUTO is OpenVINO on
      # CPU (measured p50 17.6ms against torch's 40.8ms on live 1080p frames)
      # and torch on CUDA. A failed OpenVINO load falls through to torch within
      # the same warm-up, so it never costs indexing.
      SEARCH_DETECTOR_BACKEND: ${SEARCH_DETECTOR_BACKEND:-auto}
      SEARCH_BACKEND_ATTEMPTS: ${SEARCH_BACKEND_ATTEMPTS:-3}
      SEARCH_SQUARE_LETTERBOX: ${SEARCH_SQUARE_LETTERBOX:-true}
      # The same for the plate localiser, and deliberately OFF by default: the
      # two-line ANPR thresholds were fitted under rectangular preprocessing,
      # so this is the switch for RUNNING that validation, not for turning the
      # change on before it has been done.
      SEARCH_PLATE_SQUARE_LETTERBOX: ${SEARCH_PLATE_SQUARE_LETTERBOX:-false}
      # Site-tuned plate-DETECTION weights (a .pt mounted into the models
      # volume). Empty = the open-baseline detector below; set = it wins.
      SEARCH_PLATE_WEIGHTS: ${SEARCH_PLATE_WEIGHTS:-}
      # The open-baseline plate detector (open-image-models, MIT, ONNX,
      # auto-downloads) — what makes plate reading work on a first start.
      # `${VAR-default}` (unset-only) so an EXPLICIT empty in .env disables
      # plate reading rather than silently restoring the default.
      SEARCH_PLATE_MODEL: ${SEARCH_PLATE_MODEL-yolo-v9-t-384-license-plate-end2end}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - search_crops:/data/search/crops
      # Model weights are downloaded on first run, never baked into the image:
      # the packaging harness fails on any binary it cannot account for, and a
      # .pt file is exactly that. The volume keeps the download to once.
      - search_models:/models
    # LONG FORM ON PURPOSE — the short list form is miscompiled by the overlay
    # merge. docker-compose.broker.yml re-declares this depends_on as a map
    # ({searchdb: service_healthy}); merging that map over a short LIST, compose
    # v2.27 spreads the override's condition across every inherited entry, so
    # `mediamtx` silently became service_healthy. mediamtx has no healthcheck,
    # so the whole `up` aborted with "dependency failed to start: container
    # vms_mediamtx has no healthcheck configured" and api/keycloak/motion/
    # analytics never started. Map-over-map merges per key, which is correct.
    depends_on:
      mediamtx:
        condition: service_started
      searchdb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8013/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Caddy TLS front door (OPT-IN: docker compose --profile tls up -d caddy) ─
  caddy:
    profiles: ["tls"]
    image: caddy:2.8-alpine
    container_name: vms_caddy
    restart: unless-stopped
    network_mode: host
    environment:
      # Caddyfile reads {$API_PORT:8091} to reverse-proxy the API front door.
      API_PORT: ${API_PORT:-8091}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # gen-certs.sh (repo-root scripts/) writes deploy/certs
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - keycloak
